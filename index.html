<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn trắc nghiệm Triết học Mác – Lênin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#16223B; --muted:#5B6781; --line:#D5DBE7;
  --brand:#2B4C9B; --brand-ink:#FFFFFF; --ok:#17794A; --ok-bg:#E3F4EA; --bad:#B42318; --bad-bg:#FDE8E6;
  --sel:#E4EBFA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1524; --surface:#18203A; --ink:#E8ECF6; --muted:#9AA6C1; --line:#2C3656;
    --brand:#7C9CFF; --brand-ink:#0F1524; --ok:#5DD39E; --ok-bg:#12302A; --bad:#FF8A80; --bad-bg:#3A1C1F; --sel:#222C4E;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1524; --surface:#18203A; --ink:#E8ECF6; --muted:#9AA6C1; --line:#2C3656;
  --brand:#7C9CFF; --brand-ink:#0F1524; --ok:#5DD39E; --ok-bg:#12302A; --bad:#FF8A80; --bad-bg:#3A1C1F; --sel:#222C4E;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;line-height:1.25;margin:8px 0 4px;font-weight:700}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:1rem;margin:0 0 10px;font-weight:600}
.chap{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.chap:first-of-type{border-top:0}
.chap input{margin-top:5px;width:18px;height:18px;accent-color:var(--brand);flex:none}
.chap b{font-weight:600;display:block}
.chap small{color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{flex:1 1 auto;min-width:96px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:500;background:var(--surface)}
.seg input:checked + span{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.seg input:focus-visible + span{outline:3px solid var(--brand);outline-offset:2px}
.hint{color:var(--muted);font-size:.875rem;margin:8px 0 0}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:1rem}
.btn.ghost{background:transparent;color:var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.nav button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0 12px;z-index:5}
.top .meta{display:flex;justify-content:space-between;font-size:.875rem;color:var(--muted);margin-bottom:6px;gap:8px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}
.tag{display:inline-block;font-size:.8rem;color:var(--muted);margin-bottom:8px}
.q{font-size:1.1rem;font-weight:600;line-height:1.5;margin:0 0 16px}
.opt{display:flex;gap:12px;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.opt.sel{border-color:var(--brand);background:var(--sel)}
.opt.sel .k{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.verdict{font-weight:600;margin:4px 0 12px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.nav{display:flex;gap:10px;margin-top:8px}
.nav button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.nav button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.nav button:disabled{opacity:.4}
.score{font-size:3rem;font-weight:700;line-height:1;margin:6px 0}
.wrong{border-top:1px solid var(--line);padding:12px 0}
.wrong:first-child{border-top:0}
.wrong p{margin:0 0 6px}
.wrong .a{color:var(--ok);font-size:.95rem}
.wrong .b{color:var(--bad);font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:10px}
.grid button{padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.85rem}
.grid button.done{background:var(--sel);border-color:var(--brand)}
.grid button.cur{outline:2px solid var(--brand)}
.link{background:none;border:0;color:var(--brand);padding:6px 0;font-weight:500;text-decoration:underline}
.hidden{display:none}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA = [[1,1,"Theo quan niệm của Người Hy Lạp cổ đại, triết học (philosophia) mang nghĩa là…",[["A","giải thích vũ trụ"],["B","định hướng nhận thức và hành vi"],["C","khát vọng tìm kiếm chân lý của con người"],["D","Cả A, B, C"]],"D"],[1,2,"Chọn câu trả lời đúng nhất: Triết học ra đời….",[["A","chỉ ở phương Đông"],["B","chỉ ở phương Tây"],["C","cả phương Đông và phương Tây"],["D","Cả A, B, C đều sai"]],"C"],[1,3,"Nguồn gốc nhận thức của triết học là gì?",[["A","Tri thức loài người đã hình thành được một vốn hiểu biết nhất định"],["B","Tư duy con người đạt đến trình độ khái quát hóa, trừu tượng hóa"],["C","Tri thức của các khoa học cụ thể dần hình thành"],["D","Cả A, B, C"]],"D"],[1,4,"Nguồn gốc xã hội của triết học là gì?",[["A","Chế độ tư hữu xuất hiện, phân công lao động xã hội"],["B","Xã hội phân chia giai cấp, có đối kháng giai cấp, nhà nước xuất hiện"],["C","Sự xuất hiện của lao động trí óc"],["D","Cả A, B, C"]],"D"],[1,5,"Triết học Mác – Lênin phục vụ, phản ánh lợi ích của giai cấp nào?",[["A","Giai cấp công nhân"],["B","Giai cấp nông dân"],["C","Đội ngũ trí thức"],["D","Giai cấp tư sản"]],"A"],[1,6,"Để ra đời triết học cần mấy nguồn gốc?",[["A","2"],["B","3"],["C","4"],["D","5"]],"A"],[1,7,"Ở Trung Quốc, triết học với nghĩa….",[["A","là truy tìm bản chất của đối tượng nhận thức, biểu hiện cao của trí tuệ"],["B","là “Chiêm ngưỡng”, hàm ý là tri thức dựa trên lý trí, là con đường suy ngẫm"],["C","là yêu mến sự thông thái"],["D","không có phương án đúng"]],"A"],[1,8,"Theo người Trung Quốc, triết học là…?",[["A","biểu hiện cao của trí tuệ"],["B","sự hiểu biết sâu sắc của con người về toàn bộ thế giới thiên - địa – nhân"],["C","định hướng nhân sinh quan cho con người"],["D","Cả A, B, C"]],"D"],[1,9,"Ở Ấn Độ, triết học với nghĩa…",[["A","là truy tìm bản chất của đối tượng nhận thức, biểu hiện cao của trí tuệ"],["B","là “Chiêm ngưỡng”, hàm ý là tri thức dựa trên lý trí, là con đường suy ngẫm đưa người ta đến lẽ phải"],["C","là yêu mến sự thông thái"],["D","Không có phương án đúng"]],"B"],[1,10,"Ở Hy Lạp, triết học với nghĩa…",[["A","là truy tìm bản chất của đối tượng nhận thức, biểu hiện cao của trí tuệ"],["B","là “Chiêm ngưỡng”, hàm ý là tri thức dựa trên lý trí, là con đường suy ngẫm"],["C","là yêu mến sự thông thái"],["D","không có phương án đúng"]],"C"],[1,11,"Hệ thống triết học nào quan niệm, triết học là “yêu mến sự thông thái”?",[["A","Triết học Trung Quốc cổ đại"],["B","Triết học Ấn Độ cổ đại"],["C","Triết học Hy Lạp cổ đại"],["D","Triết học cổ điển Đức"]],"C"],[1,12,"Hệ thống triết học nào quan niệm, triết học là “Chiêm ngưỡng”, hàm ý là tri thức dựa trên lý trí, là con đường suy nghĩ để dẫn dắt con người đến với lẽ phải.",[["A","Triết học Trung Quốc cổ đại"],["B","Triết học Ấn Độ cổ đại"],["C","Triết học Hy Lạp cổ đại"],["D","Triết học cổ điển Đức"]],"B"],[1,13,"Điền thuật ngữ đúng vào chỗ trống: “Triết học là hệ thống quan điểm [...] về thế giới và vị trí con người trong thế giới đó, là khoa học về những quy luật vận động, phát triển chung nhất của tự nhiên, xã hội và tư duy”.",[["A","lí luận chung nhất"],["B","lí luận"],["C","thực tiễn"],["D","kinh nghiệm"]],"A"],[1,14,"Hệ thống triết học nào quan niệm: “Triết học là hệ thống quan điểm lí luận chung nhất về thế giới và vị trí con người trong thế giới đó, là khoa học về những quy luật vận động, phát triển chung nhất của tự nhiên, xã hội và tư duy”.",[["A","Triết học cổ điển Đức"],["B","Triết học Trung Quốc cổ đại"],["C","Triết học Ấn Độ cổ đại"],["D","Triết học Mác - Lênin"]],"D"],[1,15,"Điền cụm từ đúng vào chỗ trống sau: ... là hệ thống tri thức lý luận chung nhất của con người về thế giới, về bản thân con người và vị trí của con người trong thế giới đó.",[["A","Chủ nghĩa duy vật"],["B","Chủ nghĩa duy tâm"],["C","Triết học"],["D","Thế giới quan"]],"C"],[1,16,"Triết học là ….",[["A","hạt nhân của thế giới quan"],["B","một phần của thế giới quan"],["C","toàn bộ thế giới quan"],["D","không có đáp án đúng"]],"A"],[1,17,"Nền “Triết học tự nhiên” đã đạt được thành tựu rực rỡ trong nền triết học nào?",[["A","Triết học Trung Quốc cổ đại"],["B","Triết học Ấn Độ cổ đại"],["C","Triết học Hy Lạp cổ đại"],["D","Triết học cổ điển Đức"]],"C"],[1,18,"Nền “Triết học kinh viện” thống trị trong thời kỳ nào?",[["A","Triết học Trung Quốc cổ đại"],["B","Triết học Tây Âu thời Trung cổ"],["C","Triết học Hy Lạp cổ đại"],["D","Triết học cổ điển Đức"]],"B"],[1,19,"Nền triết học nào được Ph. Ăngghen đánh giá là đã có mầm mống và đang nảy nở hầu hết tất cả các loại thế giới quan sau này…",[["A","Triết học Trung Quốc cổ đại"],["B","Triết học Tây Âu thời Trung cổ"],["C","Triết học Hy Lạp cổ đại"],["D","Triết học cổ điển Đức"]],"C"],[1,20,"Chọn phương án đúng nhất điền vào chỗ trống: Triết học Mác – Lênin xác định đối tượng nghiên cứu của triết học là những …… của tự nhiên, xã hội và tư duy.",[["A","quy luật chung nhất"],["B","quy luật đặc thù"],["C","tất cả quy luật"],["D","một số quy luật"]],"A"],[1,21,"Thế giới quan bao gồm những thành phần chủ yếu nào?",[["A","Tri thức"],["B","Niềm tin"],["C","Lý tưởng"],["D","Cả A,B,C"]],"D"],[1,22,"Hãy chỉ ra một thành phần đúng thuộc về thế giới quan…",[["A","tri thức"],["B","kinh tế"],["C","chính trị"],["D","xã hội"]],"A"],[1,23,"Hãy chỉ ra một thành phần đúng thuộc về thế giới quan…",[["A","niềm tin"],["B","kinh tế"],["C","chính trị"],["D","xã hội"]],"A"],[1,24,"Thế giới quan bao gồm những hình thức chủ yếu…",[["A","thế giới quan tôn giáo"],["B","thế giới quan khoa học"],["C","thế giới quan triết học"],["D","Cả A,B,C"]],"D"],[1,25,"Thế giới quan duy vật biện chứng bao gồm…",[["A","tri thức khoa học"],["B","niềm tin khoa học"],["C","lý tưởng khoa học"],["D","Cả A,B,C"]],"D"],[1,26,"Theo Ph. Ăngghen, vấn đề cơ bản lớn của mọi triết học là…",[["A","vật chất"],["B","ý thức"],["C","mối quan hệ giữa tư duy và tồn tại"],["D","thế giới vật chất"]],"C"],[1,27,"Vấn đề cơ bản lớn của mọi triết học có mấy mặt?",[["A","1"],["B","2"],["C","3"],["D","4"]],"B"],[1,28,"Việc giải quyết mặt thứ nhất của vấn đề cơ bản của triết học đã chia các nhà triết học thành hai trường phái lớn, đó là…?",[["A","Chủ nghĩa duy vật và chủ nghĩa duy tâm"],["B","Khả tri luận và bất khả tri luận"],["C","Hoài nghi luận và bất khả tri luận"],["D","Duy tâm chủ quan và duy tâm khách quan"]],"A"],[1,29,"Trong quá trình phát triển, chủ nghĩa duy tâm có mấy hình thức cơ bản...",[["A","5"],["B","2"],["C","3"],["D","4"]],"B"],[1,30,"Những nhà triết học, trường phái triết học cho rằng, ý thức, tinh thần là cái có trước giới tự nhiên, quyết định giới tự nhiên là….",[["A","Chủ nghĩa duy vật"],["B","Chủ nghĩa duy tâm"],["C","Bất khả tri"],["D","Nhị nguyên luận"]],"B"],[1,31,"Những nhà triết học, trường phái triết học cho rằng vật chất, giới tự nhiên là cái có trước và quyết định ý thức là….",[["A","Chủ nghĩa duy vật"],["B","Chủ nghĩa duy tâm"],["C","Bất khả tri"],["D","Nhị nguyên luận"]],"A"],[1,32,"Trường phái, học thuyết triết học nào thừa nhận chỉ một trong hai thực thể (vật chất hoặc tinh thần) là nguồn gốc của thế giới, quyết định sự vận động của thế giới được gọi là…",[["A","Nhất nguyên luận"],["B","Nhị nguyên luận"],["C","Đa nguyên"],["D","Không có phương án đúng"]],"A"],[1,33,"Trường phái, học thuyết triết học nào giải thích thế giới bằng cả hai bản nguyên vật chất và tinh thần, xem vật chất và tinh thần là hai bản nguyên có thể cùng quyết định nguồn gốc và sự vận động của thế giới gọi là…",[["A","Nhất nguyên luận"],["B","Nhị nguyên luận"],["C","Đa nguyên"],["D","Không có phương án đúng"]],"B"],[1,34,"Việc giải quyết mặt thứ nhất vấn đề cơ bản của triết học đã chia các nhà triết học thành mấy trường phái lớn …?",[["A","2"],["B","3"],["C","4"],["D","5"]],"A"],[1,35,"Trường phái triết học nào giải thích mọi hiện tượng của thế giới này bằng các nguyên nhân vật chất – nguyên nhân tận cùng của mọi vận động của thế giới này là nguyên nhân vật chất.",[["A"," bản của triết học là:",[["A","Giữa vật chất và ý thức thì cái nào có trước, cái nào có sau, cái nào quyết định cái nào."],["B","Con người có khả năng nhận thức được thế giới hay không."],["C","Vấn đề quan hệ giữa vật chất và ý thức."],["D","Vấn đề giữa tư duy và tồn tại."]],"A"],[1,155,"Quan điểm: “Vật chất và ý thức là hai nguyên thể đầu tiên cùng song song tồn tại” là quan điểm của trường phái triết học nào?",[["A","Duy vật biện chứng"],["B","Duy tâm khách quan"],["C","Duy vật siêu hình"],["D","Nhị nguyên luận"]],"D"],[1,156,"Ngành khoa học nào phát triển rực rỡ nhất và có ảnh hưởng lớn nhất đến phương pháp tư duy của thời kỳ cận đại?",[["A","Toán học"],["B","Hoá học"],["C","Sinh học"],["D","Cơ học"]],"D"],[1,157,"Những trường phái triết học nào xem thường lý luận?",[["A","Chủ nghĩa duy tâm khách quan"],["B","Chủ nghĩa kinh viện"],["C","Chủ nghĩa duy vật siêu hình"],["D","Chủ nghĩa kinh nghiệm"]],"D"],[1,158,"Những nhà triết học nào xem thường kinh nghiệm, xa rời cuộc sống?",[["A","Chủ nghĩa kinh nghiệm"],["B","Chủ nghĩa duy vật biện chứng"],["C","Chủ nghĩa kinh viện"],["D","Chủ nghĩa duy vật siêu hình"]],"C"],[1,159,"Ai là người sáng tạo ra hệ thống đầu tiên của chủ nghĩa duy vật siêu hình trong lịch sử triết học?",[["A","Ph. Bêcơn"],["B","Tô mát Hốp Xơ"],["C","Giôn Lốc Cơ"],["D","Xpinôda"]],"B"],[1,160,"Khi giải quyết vấn đề cơ bản của triết học, Đềcáctơ đứng trên lập trường triết học nào?",[["A","Chủ nghĩa duy vật"],["B","Chủ nghĩa duy tâm khách quan"],["C","Chủ nghĩa duy tâm chủ quan"],["D","Thuyết nhị nguyên"]],"D"],[1,161,"Luận điểm Đềcáctơ \"tôi tư duy vậy tôi tồn tại\" có ý nghĩa gì?",[["A","Nhấn mạnh vai trò của tư duy, duy lý"],["B","Nhấn mạnh vai trò của cảm giác"],["C","Phủ nhận vai trò của chủ thể"],["D","Đề cao kinh nghiệm"]],"A"],[1,162,"Về mặt triết học, định luật bảo toàn và chuyển hoá năng lượng chứng minh cho quan điểm nào?",[["A","Quan điểm siêu hình phủ nhận sự vận động."],["B","Quan điểm duy tâm phủ nhận sự vận động là khách quan."],["C","Quan điểm biện chứng duy vật thừa nhận sự chuyển hoá lẫn nhau của giới tự nhiên vô cơ."],["D","Cả A, B, C đều sai"]],"C"],[1,163,"Ba phát minh trong khoa học tự nhiên: định luật bảo toàn và chuyển hoá năng lượng, học thuyết tế bào, học thuyết tiến hoá chứng minh thế giới vật chất có tính chất gì?",[["A","Tính chất tách rời tĩnh tại của thế giới vật chất."],["B","Tính chất biện chứng của sự vận động và phát triển của thế giới vật chất."],["C","Tính chất không tồn tại thực của thế giới vật chất."],["D","Cả A và C là đúng"]],"B"],[1,164,"Phát minh nào trong khoa học tự nhiên nửa đầu thế kỷ XIX vạch ra nguồn gốc tự nhiên của con ngươì, chống lại quan điểm tôn giáo?",[["A","Học thuyết tế bào."],["B","Học thuyết tiến hóa."],["C","Định luật bảo toàn và chuyển hoá năng lượng."],["D","Học thuyết nguyên tử"]],"B"],[1,165,"Phát minh nào trong khoa học tự nhiên nửa đầu thế kỷ XIX vạch ra sự thống nhất giữa thế giới động vật và thực vật?",[["A","Học thuyết tế bào."],["B","Học thuyết tiến hoá."],["C","Định luật bảo toàn và chuyển hoá năng lượng."],["D","Học thuyết Nhật tâm"]],"A"],[1,166,"Coi sự vật cảm tính là cái bóng của ý niệm. Đó là quan điểm của trường phái triết học nào?",[["A","Chủ nghĩa duy tâm chủ quan"],["B","Chủ nghĩa duy tâm khách quan"],["C","Chủ nghĩa duy vật siêu hình"],["D","Chủ nghĩa duy vật biện chứng"]],"B"],[1,167,"Coi thế giới vật chất là kết quả của quá trình phát triển của ý niệm tuyệt đối là quan điểm cuả trường phái triết học nào?",[["A","Chủ nghĩa duy tâm chủ quan."],["B","Chủ nghĩa duy tâm khách quan."],["C","Chủ nghĩa duy vật siêu hình."],["D","Chủ nghĩa duy vật biện chứng."]],"B"],[1,168,"Luận điểm cho: \"tồn tại tức là được cảm giác\" là của ai và thuộc lập trường triết học nào?",[["A","Của Hêghen, thuộc lập trường của chủ nghĩa duy tâm khách quan."],["B","Của Béc-cơ-li, thuộc lập trường chủ nghĩa duy tâm chủ quan."],["C","Của Pla-tôn, thuộc lập trường chủ nghĩa duy tâm khách quan."],["D","Của A-ri-xtốt, thuộc lập trường triết học nhị nguyên."]],"B"],[2,1,"Nhà triết học nào coi lửa là thực thể đầu tiên của thế giới và đó là lập trường triết học nào?",[["A","Đê-mô-crít, - chủ nghĩa duy vật tự phát."],["B","Hê-ra-clít, - chủ nghĩa duy vật tự phát."],["C","Hê-ra-clít, - chủ nghĩa duy tâm khách quan."],["D","Ana-ximen, - chủ ngiã duy vật tự phát."]],"B"],[2,2,"Nhà triết học nào cho nguyên tử và khoảng không là thực thể đầu tiên của thế giới và đó là lập trường triết học nào?",[["A","Đê-mô-rít, chủ nghĩa duy vật tự phát."],["B","Hê-ra-clít, - chủ nghĩa duy vật tự phát"],["C","Đê-mô-crít, chủ nghĩa duy tâm khách quan."],["D","A-ri-xtốt, - chủ nghĩa duy vật tự phát."]],"A"],[2,3,"Đồng nhất vật chất nói chung với một vật thể hữu hình cảm tính đang tồn tại trong thế giới bên ngoài là quan điểm của trường phái triết học nào?",[["A","Chủ nghĩa duy tâm."],["B","Chủ nghĩa duy vật tự phát."],["C","Chủ nghĩa duy vật siêu hình thế kỷ XVII - XVIII."],["D","Chủ nghĩa duy vật biện chứng."]],"B"],[2,4,"Đồng nhất vật chất nói chung với nguyên tử - một phần tử vật chất nhỏ nhất, đó là quan điểm của trường phái triết học nào?",[["A","Chủ nghĩa duy vật siêu hình thế kỷ XVII - XVIII."],["B","Chủ nghĩa duy vật tự phát."],["C","Chủ nghĩa duy vật biện chứng."],["D","Chủ nghĩa duy tâm"]],"B"],[2,5,"Điểm chung trong quan niệm về vật chất của các nhà triết học duy vật thời kỳ cổ đại là:",[["A","Đồng nhất vật chất với những dạng tồn tại cụ thể"],["B","Đồng nhất vật chất với điện tử"],["C","Đồng nhất vật chất với khối lượng"],["D","Cả A, B, C đều đúng"]],"A"],[2,6,"Theo chủ nghĩa duy vật biện chứng, tồn tại khách quan là:",[["A","Tồn tại bên ngoài con người, độc lập với ý thức con người"],["B","Sản phẩm của tư duy con người"],["C","Tồn tại không thể nhận thức được"],["D","Tồn tại phụ thuộc vào ý thức"]],"A"],[2,7,"Theo chủ nghĩa duy vật biện chứng, thuộc tính cơ bản, phổ biến nhất của mọi dạng vật chất là:",[["A","Tồn tại"],["B","Tồn tại chủ quan"],["C","Tồn tại khách quan"],["D","Vừa tồn tại khách quan, vừa tồn tại chủ quan"]],"C"],[2,8,"Theo chủ nghĩa duy vật biện chứng, thế giới thống nhất ở:",[["A","Tính chủ quan"],["B","Sự tồn tại"],["C","Tính vật chất"],["D","Tính phổ biến"]],"C"],[2,9,"Đặc điểm chung của quan niệm duy vật về vật chất ở thời kỳ cổ đại là gì?",[["A","Đồng nhất vật chất nói chung với nguyên tử."],["B","Đồng nhất vật chất nói chung với một dạng cụ thể hữu hình, cảm tính của vật chất."],["C","Đồng nhất vật chất với khối lượng."],["D","Đồng nhất vật chất với ý thức."]],"B"],[2,10,"Hạn chế chung của quan niệm duy vật về vật chất ở thời kỳ cổ đại.",[["A","Có tính chất duy tâm chủ quan."],["B","Có tính chất duy vật tự phát, là những phỏng đoán dựa trên những tài liệu cảm tính là chủ yếu, chưa có cơ sở khoa học."],["C","Có tính chất duy vật máy móc siêu hình."],["D","Chỉ ra thuộc tính cơ bản nhất của vật chất là thuộc tính tồn tại khách quan"]],"B"],[2,11,"Đâu là mặt tích cực trong quan niệm duy vật về vật chất ở thời kỳ cổ đại?",[["A","Chống quan niệm máy móc siêu hình."],["B","Chống quan niệm duy tâm tôn giáo"],["C","Thúc đẩy sự phát triển tư tưởng khoa học về thế giới."],["D","Gồm B và C."]],"D"],[2,12,"Đỉnh cao nhất của tư tưởng duy vật cổ đại về vật chất là ở chỗ nào?",[["A","ở quan niệm về lửa là bản nguyên của thế giới"],["B","ở thuyết nguyên tử của Lơ-xíp và Đê-mô-crít."],["C","ở quan niệm về con số là bản nguyên của thế giới."],["D","ở quan niệm về nước là bản nguyên của thế giới"]],"B"],[2,13,"Điền từ đúng nhất vào chỗ trống: Theo chủ nghĩa duy vật biện chứng, vận động là thuộc tính…. của vật chất.",[["A","riêng"],["B","cố hữu"],["C","đặc thù"],["D","phổ biến"]],"B"],[2,14,"Quan điểm nào cho rằng, không gian, thời gian, vận động không liên quan với nhau và ở bên ngoài vật chất.",[["A","Chủ nghĩa duy vật siêu hình"],["B","Chủ nghĩa duy vật biện chứng"],["C","Chủ nghĩa duy tâm khách quan"],["D","Chủ nghĩa duy vật chất phác"]],"A"],[2,15,"Chọn phương án đúng nhất: Theo chủ nghĩa duy vật biện chứng, nguồn gốc của ý thức là...",[["A","nguồn gốc tự nhiên và nguồn gốc nhận thức"],["B","nguồn gốc tự nhiên và nguồn gốc xã hội"],["C","nguồn gốc xã hội và nguồn gốc kinh tế"],["D","nguồn gốc kinh tế và nguồn gốc văn hóa"]],"B"],[2,16,"Quan điểm nào cho rằng, “Óc tiết ra ý thức như gan tiết ra mật”?",[["A","Chủ nghĩa duy vật tầm thường"],["B","Chủ nghĩa duy vật biện chứng"],["C","Chủ nghĩa duy tâm khách quan"],["D","Chủ nghĩa duy tâm chủ quan"]],"A"],[2,17,"Theo chủ nghĩa duy vật biện chứng, phản ánh là thuộc tính:",[["A","Riêng có ở con người"],["B","Chỉ có ở các cơ thể sống"],["C","Riêng có ở vật chất vô cơ"],["D","Phổ biến ở mọi tổ chức vật chất"]],"D"],[2,18,"Theo chủ nghĩa duy vật biện chứng: Các yếu tố cơ bản, trực tiếp tạo thành nguồn gốc xã hội của ý thức là:",[["A","Lao động và ngôn ngữ"],["B","Kinh tế và văn hóa"],["C","Lao động trí óc và lao động chân tay"],["D","Tri thức và ý chí"]],"A"],[2,19,"Quan điểm nào cho rằng, ý thức là bản thể đầu tiên, tồn tại vĩnh viễn, là nguyên nhân sinh thành, chi phối sự tồn tại, biến đổi của toàn bộ thế giới vật chất...",[["A","chủ nghĩa duy vật siêu hình"],["B","chủ nghĩa duy vật biện chứng"],["C","chủ nghĩa duy tâm"],["D","chủ nghĩa hoài nghi"]],"C"],[2,20,"Quan điểm nào cho rằng, ý thức cũng chỉ là một dạng vật chất đặc biệt, do vật chất sản sinh ra.",[["A","Chủ nghĩa duy vật siêu hình"],["B","Chủ nghĩa duy vật biện chứng"],["C","Chủ nghĩa duy tâm khách quan"],["D","Chủ nghĩa duy tâm chủ quan"]],"A"],[2,21,"Quan điểm của trường phái triết học nào coi khối lượng chỉ là thuộc tính của vật chất, gắn liền với vật chất?",[["A","Chủ nghĩa duy tâm."],["B","Chủ nghĩa duy vật siêu hình."],["C","Chủ nghĩa duy vật biện chứng."],["D","Chủ nghĩa duy vật chất phác"]],"C"],[2,22,"Hiện tượng phóng xạ mà khoa học tự nhiên phát hiện ra chứng minh điều gì?",[["A","Vật chất nói chung là bất biến."],["B","Nguyên tử là bất biến."],["C","Nguyên tử là không bất biến."],["D","Nguyên tử là điện tử"]],"C"],[2,23,"Phát minh ra hiện tượng phóng xạ và điện tử bác bỏ quan niệm triết học nào về vật chất?",[["A","Quan niệm duy vật siêu hình về vật chất."],["B","Quan niệm duy tâm về vật chất cho nguyên tử không tồn tại."],["C","Quan niệm duy vật biện chứng về vật chất."],["D","Cả B và C"]],"A"],[2,24,"Chủ nghĩa duy tâm đã lợi dụng những phát minh của khoa học tự nhiên về hiện tượng phóng xạ và điện tử để chứng minh cái gì?",[["A","Chứng minh nguyên tử không phải là bất biến."],["B","Chứng minh nguyên tử biến đổi đồng nhất với vật chất mất đi."],["C","Chứng minh nguyên tử biến đổi nhưng vật chất nói chung không mất đi."],["D","Vật chất tồn tại khách quan"]],"B"],[2,25,"Quan niệm coi điện tử là phi vật chất thuộc lập trường triết học nào?",[["A","Chủ nghĩa duy vật siêu hình."],["B","Chủ nghĩa duy tâm."],["C","Chủ nghĩa duy vật biện chứng"],["D","Chủ nghĩa duy vật chất phác"]],"B"],[2,26,"Theo chủ nghĩa duy vật biện chứng, yếu tố nào đóng vai trò là nguồn gốc cơ bản, trực tiếp và quan trọng nhất quyết định sự ra đời và phát triển của ý thức?",[["A","Mối quan hệ giữa con người với thế giới khách quan"],["B","Bộ não người"],["C","Lao động"],["D","Ngôn ngữ"]],"C"],[2,27,"Quan điểm nào cho rằng, ý thức là hình ảnh chủ quan của thế giới khách quan?",[["A","Chủ nghĩa duy vật siêu hình"],["B","Chủ nghĩa duy vật biện chứng"],["C","Chủ nghĩa duy tâm khách quan"],["D","Chủ nghĩa duy vật chất phác"]],"B"],[2,28,"Theo chủ nghĩa duy vật biện chứng, sự tác động trở lại của ý thức đối với vật chất được thực hiện thông qua:",[["A","Suy nghĩ của con người"],["B","Hoạt động nhận thức của con người"],["C","Hoạt động thực tiễn của con người"],["D","Hoạt động tinh thần"]],"C"],[2,29,"Nguyên tắc xuất phát từ thực tế khách quan, tôn trọng khách quan, đồng thời phát huy tính năng động chủ quan đòi hỏi trong nhận thức và thực tiễn cần tránh sai lầm:",[["A","Ngụy biện và tại khách quan."],["C","1- Phạm trù triết học, 2- Một vật thể"],["D","1- Phạm trù triết học, 2- Nguyên tử"]],"B"],[2,36,"Chọn phương án đúng nhất: Tuyệt đối hóa vai trò của vật chất sẽ mắc phải sai lầm...",[["A","Giáo điều"],["B","Ngụy biện"],["C","Phiến diện"],["D","Bảo thủ, trì trệ, thụ động"]],"D"],[2,37,"Chọn phương án đúng nhất: Tuyệt đối hóa vai trò của ý thức sẽ mắc phải sai lầm...",[["A","Chủ quan duy ý chí"],["B","Ngụy biện"],["C","Bảo thủ, trì trệ, thụ động"],["D","Phiến diện"]],"A"],[2,38,"Tục ngữ Việt Nam đã khẳng định: “Có thực mới vực được đạo”, quan điểm trên thuộc lập trường triết học nào?",[["A","Chủ nghĩa duy vật"],["B","Chủ nghĩa duy tâm"],["C","Nhị nguyên"],["D","Khả tri luận"]],"A"],[2,39,"Theo V.I. Lênin, ngoài thuộc tính tồn tại khách quan thì vật chất dưới những dạng tồn tại cụ thể của nó là cái có thể...",[["A","Tồn tại trong cảm giác của con người"],["B","Gây nên cảm giác ở con người"],["C","Tồn tại độc lập với cảm giác của con người"],["D","Tồn tại trong ý thức của con người"]],"B"],[2,40,"Quan điểm sau đây thuộc trường phái triết học nào: cái gì cảm giác được là vật chất.",[["A","Chủ nghĩa duy vật siêu hình."],["B","Chủ nghĩa duy vật biện chứng."],["C","Chủ nghĩa duy tâm khách quan"],["D","Chủ nghĩa duy tâm chủ quan."]],"D"],[2,41,"Theo chủ nghĩa duy vật biện chứng, một trong những biểu hiện tính năng động, sáng tạo của phản ánh ý thức là…",[["A","Hình ảnh vật lý"],["B","Là một hiện tượng xã hội"],["C","Tạo ra những ý tưởng, giả thuyết, huyền thoại"],["D","Sinh ra được vật chất"]],"C"],[2,42,"Theo chủ nghĩa duy vật biện chứng, bản chất của ý thức là...",[["A","Sản phẩm của mọi dạng vật chất"],["B","Một dạng vật chất đặc biệt"],["C","Sự phản ánh của các lực lượng siêu tự nhiên"],["D","Sự phán ánh năng động, sáng tạo thế giới khách quan vào bộ óc con người"]],"D"],[2,43,"Hạn chế của chủ nghĩa duy vật chất phác là:",[["A","Xem xét thế giới trong trạng thái biệt lập và tĩnh tại"],["B","Xem xét thế g n của thực tiễn?",[["A","Nghiên cứu khoa học"],["B","Sản xuất vật chất"],["C","Sáng tạo nghệ thuật"],["D","Tâm lý, tình cảm"]],"B"],[2,115,"Quy luật nào được V.I. Lênin gọi là hạt nhân của phép biện chứng duy vật?",[["A","Quy luật chuyển hóa từ những sự thay đổi về lượng thành những thay đổi về chất và ngược lại"],["B","Quy luật thống nhất và đấu tranh giữa các mặt đối lập"],["C","Quy luật phủ định của phủ định"],["D","Quy luật quan hệ sản xuất phù hợp với trình độ phát triển của lực lượng sản xuất"]],"B"],[2,116,"Điền vào chỗ trống: ……... là sự tác động qua lại giữa các mặt, các khuynh hướng đối lập nằm trong chính mỗi sự vật, hiện tượng; có vai trò quy định trực tiếp quá trình vận động và phát triển của sự vật, hiện tượng.",[["A","Mâu thuẫn chủ yếu"],["B","Mâu thuẫn cơ bản"],["C","Mâu thuẫn đối kháng"],["D","Mâu thuẫn bên trong"]],"D"],[2,117,"Điền vào chỗ trống ............ xuất hiện trong mối liên hệ giữa các sự vật, hiện tượng với nhau; tuy cũng ảnh hưởng đến sự tồn tại và phát triển của chúng nhưng phải thông qua mâu thuẫn bên trong mới phát huy tác dụng.",[["A","Mâu thuẫn thứ yếu"],["B","Mâu thuẫn không cơ bản"],["C","Mâu thuẫn bên ngoài"],["D","Mâu thuẫn không đối kháng"]],"C"],[2,118,"Điền vào chỗ trống: .............là mâu thuẫn giữa các giai cấp, tập đoàn người, lực lượng, xu hướng xã hội có lợi ích cơ bản đối lập nhau và không thể điều hòa được.",[["A","Mâu thuẫn chủ yếu"],["B","Mâu thuẫn cơ bản"],["C","Mâu thuẫn bên trong"],["D","Mâu thuẫn đối kháng"]],"D"],[2,119,"Lựa chọn câu đúng nhất theo quan điểm DVBC:",[["A","Phát triển là sự thay đổi thuần tuý về mặt số lượng hay khối lượng của sự vật hiện tượng"],["B","Phát triển là sự thay đổi về vị trí của sự vật hiện tượng trong không gian, thời gian"],["C","Phát triển không chỉ là sự thay đổi về lượng mà nó còn là sự thay đổi về chất của sự vật hiện tượng"],["D","Phát triển chỉ có sự thay đổi về lượng"]],"C"],[2,120,"Nguyên tắc phát triển giúp chúng ta khắc phục được tư tưởng:",[["A","Nôn nóng, tả khuynh"],["B","Chiết trung, ngụy biện"],["C","Phiến diện, siêu hình"],["D","Bảo thủ, trì trệ, định kiến"]],"D"],[2,121,"Ph. Ăngghen đã cho rằng: Đối với những ai phủ nhận (...) thì mọi quy luật của tự nhiên đều là giả thuyết.",[["A","Tính phổ biến"],["B","Tính nhân quả"],["C","Tính tất yếu"],["D","Tính biện chứng"]],"B"],[2,122,"Một sinh viên quan niệm: Vì nhà nghèo, cha mẹ đã phải nỗ lực chu cấp cho đi học đại học nên mình phải cố gắng rèn luyện, học giỏi, ra trường tìm được việc làm với mức thu nhập cao. Vận dụng cặp phạm trù nào của phép biện chứng duy vật để giải thích quan niệm trên?",[["A","Cái riêng - cái chung"],["B","Nguyên nhân - kết quả"],["C","Bản chất - hiện tượng"],["D","Tất nhiên - ngẫu nhiên"]],"B"],[2,123,"Chọn phương án SAI: Phủ định biện chứng là sự phủ định...",[["A","Có tính chất kế thừa"],["B","Chấm dứt hoàn toàn quá trình phát triển"],["C","Có tính tự thân"],["D","Có tính khách quan, phổ biến"]],"B"],[2,124,"Mối liên hệ của các sự vật hiện tượng là gì? Xác định câu trả lời đúng nhất.",[["A","Là sự tác động lẫn nhau, chi phối, chuyển hoá lẫn nhau một cách khách quan, phổ biến, nhiều vẻ giữa các mặt, quá trình của sự vật, hiện tượng hoặc giữa các sự vật, hiện tượng"],["B","Là sự thừa nhận rằng giữa các mặt của sự vật, hiện tượng và giữa các sự vật với nhau trong thực tế khách quan không có mối liên hệ nào cả"],["C","Là sự tác động lẫn nhau, có tính khách quan, phổ biến, nhiều vẻ, không thể chuyển hoá cho nhau"],["D","Là chỉ sự tác động của các yếu tố bên ngoài"]],"A"],[2,125,"Chọn câu trả lời đúng: Chất của sự vật là:",[["A","Những yếu tố tạo nên sự vật"],["B","Thuộc tính không cơ bản"],["C","Một thuộc tính duy nhất của sự vật"],["D","Sự thống nhất hữu cơ của các thuộc tính"]],"D"],[2,126,"Xác định quan niệm sai về phủ định biện chứng:",[["A","Phủ định có tính kế thừa"],["B","Phủ định là chấm dứt sự phát triển"],["C","Phủ định đồng thời cũng là khẳng định"],["D","Phủ định có tính khách quan phổ biến"]],"B"],[2,127,"Ph.Ăngghen viết: \"[...] là điều kiện cơ bản đầu tiên của toàn bộ đời sống loài người, và như thế đến một mức mà trên một ý nghĩa nào đó, chúng ta phải nói: [...] đã sáng tạo ra bản thân con người\". Hãy điền một từ vào chỗ trống để hoàn thiện câu trên.",[["A","Lao động"],["B","Vật chất"],["C","Tự nhiên"],["D","Sản xuất"]],"A"],[2,128,"Trong \"Bút ký triết học\", V.I.Lênin viết: \"Nhận thức là sự tiến gần mãi mãi và vô tận của [. ... ] đến khách thể\". Hãy điền vào chỗ trống để hoàn thiện câu trên.",[["A","Chủ thể"],["B","Ý thức"],["C","Tư duy"],["D","Nhận thức"]],"A"],[2,129,"Triết học Mác-Lênin cho rằng, thực tiễn là toàn bộ [...] có mục đích, mang tính lịch sử - xã hội của con người nhằm cải tạo thế giới khách quan. Hãy điền vào chỗ trống để hoàn thiện quan điểm trên.",[["A","Hoạt động vật chất và tinh thần"],["B","Hoạt động vật chất"],["C","Hoạt động tinh thần"],["D","Mọi hoạt động"]],"B"],[2,130,"Ph.Ăngghen viết về vai trò động lực của thực tiễn đối với nhận thức như sau: \"Khi xã hội có nhu cầu về kỹ thuật thì nó thúc đẩy khoa học phát triển hơn mười [. ]\". Hãy điền vào chỗ trống để hoàn thiện câu trên.",[["A","Nhà phát minh"],["B","Thế kỉ"],["C","Vạn người"],["D","Trường đại học"]],"D"],[2,131,"Theo quan niệm của triết học Mác - Lênin, thực tiễn là:",[["A","Toàn bộ hoạt động vật chất có mục đích, mang tính lịch sử – xã hội của con người nhằm cải tạo thế giới khách quan"],["B","Toàn bộ hoạt động tinh thần có mục đích, mang tính lịch sử – xã hội của con người nhằm cải tạo thế giới khách quan"],["C","Toàn bộ hoạt động vật chất và tinh thần có mục đích, mang tính lịch sử – xã hội của con người nhằm cải tạo thế giới khách quan"],["D","Thực tế"]],"A"],[2,132,"Theo quan niệm của triết học Mác - Lênin, bản chất của nhận thức là:",[["A","Sự phản ánh thế giới khách quan vào đầu óc của con người"],["B","Sự phản ánh chủ động, tích cực, sáng tạo của chủ thể trước khách thể"],["C","Sự tiến gần của tư duy đến hạ tầng và kiến trúc thượng tầng chính là mối quan hệ giữa:",[["A","Kinh tế và kỹ thuật, công nghệ"],["B","Kỹ thuật và văn hóa"],["C","Kinh tế và chính trị"],["D","Tất cả các phương án đều sai"]],"C"],[3,178,"Điền cụm từ đúng nhất vào chỗ trống: Khái niệm phương thức sản xuất dùng để chỉ những ... mà con người sử dụng để tiến hành quá trình sản xuất của xã hội ở những giai đoạn lịch sử nhất định.",[["A","Cách thức"],["B","Hình thức"],["C","Công cụ sản xuất"],["D","Năng lực"]],"A"],[3,179,"Chọn phương án đúng nhất: Theo chủ nghĩa duy vật lịch sử, sự vận động, phát triển của toàn bộ đời sống xã hội, suy đến cùng có nguyên nhân từ tình trạng phát triển của:",[["A","Nền sản xuất của xã hội"],["B","Cơ sở hạ tầng"],["C","Quan hệ sản xuất"],["D","Ý thức xã hội"]],"A"],[3,180,"Theo chủ nghĩa duy vật lịch sử: Yếu tố phản ánh rõ nhất trình độ phát triển của lực lượng sản xuất và thể hiện tiêu biểu trình độ con người chinh phục giới tự nhiên là:",[["A","Người lao động"],["B","Đối tượng lao động"],["C","Khoa học"],["D","Công cụ lao động"]],"D"],[3,181,"Theo chủ nghĩa duy vật lịch sử: Yếu tố nào KHÔNG thuộc cơ sở hạ tầng?",[["A","Quan hệ sản xuất thống trị"],["B","Quan hệ sản xuất tàn dư"],["C","Quan hệ sản xuất mầm mống"],["D","Quan hệ chính trị - xã hội"]],"D"],[3,182,"Theo chủ nghĩa duy vật lịch sử: Yếu tố nào sau đây KHÔNG thuộc cấu trúc của hình thái kinh tế - xã hội?",[["A","Lực lượng sản xuất"],["B","Quan hệ sản xuất"],["C","Kiến trúc thượng tầng"],["D","Điều kiện tự nhiên"]],"D"],[3,183,"Điền cụm từ đúng nhất: Theo nghĩa hẹp, ... là việc lật đổ một chế độ chính trị đã lỗi thời và thiết lập một chế độ chính trị tiến bộ hơn của giai cấp cách mạng.",[["A","Cách mạng xã hội"],["B","Cách mạng khoa học và công nghệ"],["C","Đấu tranh giai cấp"],["D","Tất cả các phương án đều sai"]],"A"],[3,184,"Theo chủ nghĩa duy vật lịch sử, cách mạng xã hội giữ vai trò là một trong những ... của sự phát triển xã hội.",[["A","Hình thức, động lực"],["B","Phương thức, động lực"],["C","Phương hướng, động lực"],["D","Mục tiêu, động lực"]],"B"],[3,185,"Điền cụm từ đúng nhất vào chỗ trống: Theo C. Mác: Bản chất con người không phải là một cái trừu tượng cố hữu của cá nhân riêng biệt. Trong tính hiện thực của nó, bản chất con người là tổng hòa những...",[["A","Quan hệ sản xuất"],["B","Quan hệ xã hội"],["C","Quan hệ giai cấp"],["D","Quan hệ kinh tế"]],"B"],[3,186,"Theo nguyên lý tồn tại xã hội quyết định ý thức xã hội, lối sống, phong tục tập quán của con người ở những vùng miền khác nhau là do:",[["A","Bản sắc văn hóa của mỗi vùng miền"],["B","Điều kiện kinh tế - xã hội ở mỗi vùng miền khác nhau"],["C","Cơ chế, chính sách quản lí văn hóa mỗi vùng miền"],["D","Tất cả các phương án đều sai"]],"B"],[3,187,"Chọn phương án SAI: Theo chủ nghĩa duy vật lịch sử, nhà nước...",[["A","Ra đời cùng sự xuất hiện của con người"],["B","Là sản phẩm và biểu hiện của những mâu thuẫn đối kháng giai cấp không thể điều hòa được"],["C","Xuất hiện và tồn tại trong một giai đoạn phát triển nhất định của xã hội loài người"],["D","Xuất hiện và tồn tại trong những xã hội có đối kháng giai cấp"]],"A"],[3,188,"Từ nguyên lý tồn tại xã hội quyết định ý thức xã hội của chủ nghĩa duy vật lịch sử, cho thấy tâm lý tiểu nông của người Việt Nam truyền thống căn bản là do:",[["A","Bản tính cố hữu của người Việt"],["B","Bị đế quốc, phong kiến nhiều thế kỷ áp bức, bóc lột"],["C","Phương thức sản xuất tiểu nông, manh mún, lạc hậu"],["D","Tất cả các phương án đều sai"]],"C"]];
const CHAPS = {1:"Chương 1: Khái lược về triết học và triết học Mác–Lênin",2:"Chương 2: Chủ nghĩa duy vật biện chứng",3:"Chương 3: Chủ nghĩa duy vật lịch sử"};
// DATA item: [chương, số câu gốc, đề, [[A,text],...], đáp án đúng]
const Q = DATA.map(d=>({id:d[0]+"-"+d[1],c:d[0],n:d[1],q:d[2],o:d[3],a:d[4]}));
const BY_ID = Object.fromEntries(Q.map(x=>[x.id,x]));
const app = document.getElementById('app');

function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let wrongSet = new Set(lsGet('ph_wrong',[]));
let settings = lsGet('ph_settings',{chaps:[1,2,3],order:'seq',count:'all',mode:'instant'});
let run = null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function home(){
  run=null;
  const cnt = c=>Q.filter(x=>x.c===c).length;
  app.innerHTML = `
  <h1>Ôn trắc nghiệm Triết học Mác – Lênin</h1>
  <p class="sub">${Q.length} câu, đáp án lấy từ bảng “Gợi ý đáp án” trong file.</p>
  <div class="card"><h2>Chọn chương</h2>
    ${[1,2,3].map(c=>`<label class="chap"><input type="checkbox" name="chap" value="${c}" ${settings.chaps.includes(c)?'checked':''}><span><b>${CHAPS[c]}</b><small>${cnt(c)} câu</small></span></label>`).join('')}
  </div>
  <div class="card"><h2>Thứ tự câu hỏi</h2>
    <div class="seg">
      <label><input type="radio" name="order" value="seq" ${settings.order==='seq'?'checked':''}><span>Theo thứ tự</span></label>
      <label><input type="radio" name="order" value="rnd" ${settings.order==='rnd'?'checked':''}><span>Xáo trộn</span></label>
    </div>
  </div>
  <div class="card"><h2>Số câu</h2>
    <div class="seg">
      ${['20','50','100','all'].map(v=>`<label><input type="radio" name="count" value="${v}" ${settings.count===v?'checked':''}><span>${v==='all'?'Tất cả':v}</span></label>`).join('')}
    </div>
  </div>
  <div class="card"><h2>Cách chấm</h2>
    <div class="seg">
      <label><input type="radio" name="mode" value="instant" ${settings.mode==='instant'?'checked':''}><span>Hiện đáp án ngay</span></label>
      <label><input type="radio" name="mode" value="exam" ${settings.mode==='exam'?'checked':''}><span>Thi thử (chấm cuối)</span></label>
    </div>
    <p class="hint">Thứ tự A–D giữ nguyên như đề để các câu “Cả A, B, C” vẫn đúng nghĩa.</p>
  </div>
  <button class="btn" id="start">Bắt đầu</button>
  <div style="height:10px"></div>
  <button class="btn ghost" id="redo" ${wrongSet.size?'':'disabled'}>Ôn lại câu đã làm sai (${wrongSet.size})</button>
  ${wrongSet.size?'<div style="text-align:center;margin-top:8px"><button class="link" id="clr">Xóa danh sách câu sai</button></div>':''}`;
  document.getElementById('start').onclick=()=>{
    const chaps=[...document.querySelectorAll('input[name=chap]:checked')].map(i=>+i.value);
    if(!chaps.length){alert('Chọn ít nhất 1 chương');return}
    settings={chaps,order:val('order'),count:val('count'),mode:val('mode')};
    lsSet('ph_settings',settings);
    let pool=Q.filter(x=>chaps.includes(x.c));
    if(settings.order==='rnd') pool=shuffle(pool);
    if(settings.count!=='all') pool=pool.slice(0,+settings.count);
    start(pool,settings.mode);
  };
  document.getElementById('redo').onclick=()=>{
    const pool=shuffle([...wrongSet].map(i=>BY_ID[i]).filter(Boolean));
    start(pool,settings.mode);
  };
  const clr=document.getElementById('clr');
  if(clr) clr.onclick=()=>{if(confirm('Xóa toàn bộ danh sách câu sai?')){wrongSet=new Set();lsSet('ph_wrong',[]);home()}};
}
function val(n){return document.querySelector(`input[name=${n}]:checked`).value}

function start(pool,mode){
  run={pool,mode,i:0,ans:{},};
  render();
}

function render(){
  const {pool,mode,i,ans}=run, q=pool[i], total=pool.length;
  const picked=ans[q.id]; const locked = mode==='instant' && picked!==undefined;
  const answered=Object.keys(ans).length;
  const right=pool.filter(x=>ans[x.id]===x.a).length;
  const last = i===total-1;
  app.innerHTML = `
  <div class="top">
    <div class="meta"><span>Câu ${i+1}/${total}</span><span>${mode==='instant'?`Đúng ${right}/${answered}`:`Đã chọn ${answered}/${total}`}</span></div>
    <div class="bar"><i style="width:${(answered/total*100).toFixed(1)}%"></i></div>
  </div>
  <div class="tag">Chương ${q.c} · câu ${q.n} trong file</div>
  <p class="q">${esc(q.q)}</p>
  <div id="opts">
  ${q.o.map(([k,t])=>{
    let cls='opt';
    if(locked){ if(k===q.a) cls+=' ok'; else if(k===picked) cls+=' bad'; }
    else if(picked===k) cls+=' sel';
    return `<button class="${cls}" data-k="${k}" ${locked?'disabled':''}><span class="k">${k}</span><span>${esc(t)}</span></button>`;
  }).join('')}
  </div>
  ${locked?`<div class="verdict ${picked===q.a?'ok':'bad'}">${picked===q.a?'Chính xác':'Chưa đúng, đáp án là '+q.a}</div>`:''}
  <div class="nav">
    <button id="prev" ${i===0?'disabled':''}>Câu trước</button>
    ${last?`<button id="fin" class="primary">Nộp bài</button>`:`<button id="next" class="primary">Câu sau</button>`}
  </div>
  <div style="text-align:center;margin-top:14px">
    <button class="link" id="jump">Danh sách câu</button> · <button class="link" id="quit">Thoát</button>
  </div>
  <div class="grid hidden" id="grid">${pool.map((x,idx)=>`<button data-i="${idx}" class="${ans[x.id]!==undefined?'done':''} ${idx===i?'cur':''}">${idx+1}</button>`).join('')}</div>`;
  window.scrollTo(0,0);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b.dataset.k));
  const p=document.getElementById('prev'); if(p) p.onclick=()=>{run.i--;render()};
  const n=document.getElementById('next'); if(n) n.onclick=()=>{run.i++;render()};
  const f=document.getElementById('fin'); if(f) f.onclick=finish;
  document.getElementById('quit').onclick=()=>{if(confirm('Thoát bài làm hiện tại?'))home()};
  document.getElementById('jump').onclick=()=>document.getElementById('grid').classList.toggle('hidden');
  document.querySelectorAll('#grid button').forEach(b=>b.onclick=()=>{run.i=+b.dataset.i;render()});
}

function choose(k){
  const q=run.pool[run.i];
  if(run.mode==='instant' && run.ans[q.id]!==undefined) return;
  run.ans[q.id]=k;
  if(run.mode==='instant'){
    if(k===q.a) wrongSet.delete(q.id); else wrongSet.add(q.id);
    lsSet('ph_wrong',[...wrongSet]);
  }
  render();
}

function finish(){
  const {pool,mode,ans}=run;
  const un=pool.filter(x=>ans[x.id]===undefined).length;
  if(un && !confirm(`Còn ${un} câu chưa chọn. Vẫn nộp bài?`)) return;
  if(mode==='exam'){
    pool.forEach(x=>{ if(ans[x.id]===undefined) return; if(ans[x.id]===x.a) wrongSet.delete(x.id); else wrongSet.add(x.id)});
    lsSet('ph_wrong',[...wrongSet]);
  }
  const wrongs=pool.filter(x=>ans[x.id]!==x.a);
  const right=pool.length-wrongs.length;
  const pct=Math.round(right/pool.length*100);
  const txt=x=>x.o.find(o=>o[0]===x)?.[1];
  app.innerHTML=`
  <h1>Kết quả</h1>
  <div class="card"><div class="score">${right}/${pool.length}</div><p class="sub" style="margin:0">${pct}% đúng${un?`, ${un} câu bỏ trống`:''}</p></div>
  <div class="row"><button class="btn" id="again" ${wrongs.length?'':'disabled'}>Làm lại ${wrongs.length} câu sai</button><button class="btn ghost" id="home">Về trang chủ</button></div>
  <div style="height:16px"></div>
  ${wrongs.length?`<div class="card"><h2>Các câu sai / bỏ trống</h2>${wrongs.map(x=>{
    const g=ans[x.id]; const t=k=>esc(x.o.find(o=>o[0]===k)[1]);
    return `<div class="wrong"><div class="tag">Chương ${x.c} · câu ${x.n}</div><p>${esc(x.q)}</p>
    ${g?`<div class="b">Bạn chọn ${g}. ${t(g)}</div>`:'<div class="b">Chưa chọn</div>'}
    <div class="a">Đáp án ${x.a}. ${t(x.a)}</div></div>`}).join('')}</div>`:'<p class="sub">Đúng hết, ngon.</p>'}`;
  window.scrollTo(0,0);
  document.getElementById('home').onclick=home;
  document.getElementById('again').onclick=()=>start(shuffle(wrongs),mode);
}

document.addEventListener('keydown',e=>{
  if(!run || e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key.toUpperCase();
  if(['A','B','C','D'].includes(k)){ if(run.pool[run.i].o.some(o=>o[0]===k)) choose(k); }
  else if(e.key==='ArrowRight'||e.key==='Enter'){const n=document.getElementById('next'); if(n) n.click();}
  else if(e.key==='ArrowLeft'){const p=document.getElementById('prev'); if(p&&!p.disabled) p.click();}
});
home();
</script>
</body>
</html>
